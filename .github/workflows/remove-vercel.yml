name: Remove leftover Vercel folder
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/remove-vercel.yml"
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete .vercel and push
        run: |
          if [ ! -d .vercel ]; then
            echo "No .vercel folder"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .vercel
          git commit -m "Remove leftover Vercel output"
          git push
          git rm -f .github/workflows/remove-vercel.yml || true
          git commit -m "Remove one-shot Vercel cleanup workflow" || true
          git push || true
